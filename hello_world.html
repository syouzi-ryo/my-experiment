<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学実験室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6; /* 薄いグレー */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 2rem;
        }

        .btn-start {
            background-color: #2563eb;
            color: white;
            padding: 1rem 2rem;
            font-size: 1.25rem;
            border-radius: 0.5rem;
            transition: background-color 0.3s;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-start:hover {
            background-color: #1d4ed8;
        }

        /* カスタムメッセージボックスのスタイル (alertの代わり) */
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
        }

        .close-btn {
            margin-top: 1.5rem;
            background-color: #4b5563;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>心理学実験室へようこそ</h1>
        <button id="start-button" class="btn-start">実験を開始する</button>
    </div>

    <!-- アラート用のオーバーレイとボックス -->
    <div id="overlay"></div>
    <div id="custom-alert">
        <p id="alert-message" style="font-size: 1.5rem; color: #111827;">Hello World!</p>
        <button class="close-btn" onclick="closeAlert()">閉じる</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startButton = document.getElementById('start-button');
            const alertBox = document.getElementById('custom-alert');
            const overlay = document.getElementById('overlay');

            // ボタンクリック時の処理
            startButton.addEventListener('click', () => {
                showAlert();
            });

            // アラートを表示する関数
            function showAlert() {
                alertBox.style.display = 'block';
                overlay.style.display = 'block';
            }

            // アラートを閉じる関数
            window.closeAlert = function() {
                alertBox.style.display = 'none';
                overlay.style.display = 'none';
            };

            // オーバーレイクリックでも閉じられるように設定
            overlay.addEventListener('click', closeAlert);
        });
    </script>
</body>
</html>
