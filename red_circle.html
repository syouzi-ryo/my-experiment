<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsPsych Red Circle Experiment</title>
    <!-- jsPsych core library and plugins via CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        /* Specification 1: Background color set to gray (#808080) */
        body {
            background-color: #808080;
            color: white; /* Contrast for instructions */
            margin: 0;
            padding: 0;
        }

        /* Specification 2: Red circle with 100px diameter using CSS */
        .red-circle {
            width: 100px;
            height: 100px;
            background-color: #ff0000;
            border-radius: 50%;
            margin: 0 auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .instruction-text {
            margin-top: 20px;
            font-family: sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        /**
         * jsPsych v7 experiment
         * Requirements: Gray background, central 100px red circle, space to end.
         */
        window.onload = function() {
            // Initialize jsPsych
            const jsPsych = initJsPsych({
                display_element: 'jspsych-target',
                on_finish: function() {
                    // Display raw data at the end
                    jsPsych.data.displayData();
                }
            });

            const timeline = [];

            // Specification 2 & 3: Display circle until space key is pressed
            const trial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `
                    <div class="container">
                        <div class="red-circle"></div>
                        <div class="instruction-text">スペースキーを押して終了してください</div>
                    </div>
                `,
                choices: [' '], // Specification 3: Only space key is accepted
                post_trial_gap: 0
            };
            timeline.push(trial);

            // Specification 4: Show end message
            const end_message = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `
                    <div class="instruction-text">
                        <p>終了しました。データが表示されます。</p>
                    </div>
                `,
                choices: "NO_KEYS",
                trial_duration: 2000
            };
            timeline.push(end_message);

            // Run the experiment
            jsPsych.run(timeline);
        };
    </script>
</body>
</html>
