<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミュラー・リヤー錯視実験</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-slider-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f0f0; }
        .jspsych-display-element { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <script>
        const jsPsych = initJsPsych({
            on_finish: function() {
                const display = jsPsych.getDisplayElement();
                display.innerHTML = '<p>データを送信中です...</p>';
                
                const allData = jsPsych.data.get().filter({trial_type: 'canvas-slider-response'}).values();
                const subject_id = jsPsych.data.get().values()[0].response.subject_id;
                
                const exportData = allData.map(d => ({
                    subject_id: subject_id,
                    timestamp: d.time_elapsed,
                    angle: d.angle,
                    wing_length: d.wing_length,
                    pse: d.response,
                    error_amount: Math.abs(d.response - 200)
                }));

                fetch('https://script.google.com/macros/s/AKfycbyLzI2IIEexEhdlUtHz8FWg-KTX0_bLjRz92Fheo9Is9Ken3vuOL2tBMzjKuFKWkT5Hjg/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(exportData)
                }).then(() => {
                    display.innerHTML = '<h1>実験終了。ご協力ありがとうございました。</h1>';
                });
            }
        });

        const angles = [15, 75];
        const wingLengths = [20, 50];
        let trials = [];

        for (let angle of angles) {
            for (let wingLen of wingLengths) {
                for (let i = 0; i < 3; i++) {
                    trials.push({ angle: angle, wingLen: wingLen });
                }
            }
        }
        trials = jsPsych.randomization.repeat(trials, 1);

        const drawStimuli = (c, sliderValue, tData) => {
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, c.width, c.height);
            const centerX = c.width / 2;
            const y1 = c.height / 3;
            const y2 = (c.height / 3) * 2;
            const standardLen = 200;
            const comparisonLen = sliderValue;

            const drawMullerLyer = (x, y, len, isStandard, angle, wLen) => {
                ctx.beginPath();
                ctx.moveTo(x - len / 2, y);
                ctx.lineTo(x + len / 2, y);
                ctx.stroke();

                const rad = angle * Math.PI / 180;
                const dir = isStandard ? 1 : -1;

                ctx.moveTo(x - len / 2, y);
                ctx.lineTo(x - len / 2 + wLen * Math.cos(rad), y - wLen * Math.sin(rad) * dir);
                ctx.moveTo(x - len / 2, y);
                ctx.lineTo(x - len / 2 + wLen * Math.cos(rad), y + wLen * Math.sin(rad) * dir);

                ctx.moveTo(x + len / 2, y);
                ctx.lineTo(x + len / 2 - wLen * Math.cos(rad), y - wLen * Math.sin(rad) * dir);
                ctx.moveTo(x + len / 2, y);
                ctx.lineTo(x + len / 2 - wLen * Math.cos(rad), y + wLen * Math.sin(rad) * dir);
                ctx.stroke();
            };

            drawMullerLyer(centerX, y1, standardLen, true, tData.angle, tData.wingLen);
            drawMullerLyer(centerX, y2, comparisonLen, false, tData.angle, tData.wingLen);
        };

        const subject_id_trial = {
            type: jsPsychSurveyText,
            questions: [{prompt: "参加者IDを入力してください", name: "subject_id"}]
        };

        const experiment = trials.map((t, idx) => ({
            type: jsPsychCanvasSliderResponse,
            stimulus: (c) => drawStimuli(c, 200, t),
            on_start: (trial) => {
                trial.slider_start = Math.floor(Math.random() * 251) + 50;
                trial.prompt = `<p>試行 ${idx + 1} / ${trials.length}</p>`;
                trial.angle = t.angle;
                trial.wing_length = t.wingLen;
            },
            on_load: () => {
                const slider = document.querySelector('input[type=range]');
                const canvas = document.querySelector('canvas');
                slider.addEventListener('input', (e) => {
                    drawStimuli(canvas, parseInt(e.target.value), t);
                });
            },
            canvas_size: [400, 600],
            min: 50,
            max: 350,
            button_label: '次へ'
        }));

        const welcome = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<h1>ミュラー・リヤー錯視実験</h1><p>スペースキーを押して開始してください。</p>'
        };

        jsPsych.run([welcome, subject_id_trial, ...experiment]);
    </script>
</body>
</html>
