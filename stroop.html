<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task (ストループ課題)</title>
    
    <!-- jsPsych v7.3.4 コアライブラリの読み込み -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    
    <!-- キーボード反応用プラグインの読み込み -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    
    <!-- 全画面表示用プラグインの読み込み -->
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>

    <!-- 参加者情報入力用（テキスト記述）プラグインの読み込み -->
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    
    <!-- jsPsych標準スタイルシートの読み込み -->
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

    <!-- Tailwind CSS によるモダンなデザインシステム -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 実験画面の全体デザイン調整 */
        body {
            background-color: #FFFFFF !important; /* 背景色: 白 */
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif !important; /* 指定フォント */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1f2937;
            overflow: hidden;
            user-select: none;
        }

        /* 刺激語のテキスト設定 */
        .stimulus {
            font-size: 60px; /* 刺激サイズ: 60px */
            font-weight: 800;
            letter-spacing: 0.05em;
            user-select: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* 注視点（+）のテキスト設定 */
        .fixation {
            font-size: 60px; /* 注視点サイズ: 60px */
            font-weight: 400;
            color: #4b5563;
        }

        /* jsPsychのコンテナサイズをフルに調整 */
        #jspsych-target {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Survey Text プラグインの入力欄を Tailwind 調に微調整 */
        .jspsych-survey-text-question {
            margin-bottom: 20px;
            text-align: left;
        }
        .jspsych-survey-text-question input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            color: #1f2937;
            background-color: #f9fafb;
            transition: all 0.2s ease-in-out;
        }
        .jspsych-survey-text-question input[type="text"]:focus {
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // 1. 未処理のPromise拒否 (unhandledrejection) をグローバルに監視し、
        // サンドボックス制限によるFullscreenエラーのクラッシュを抑制する
        window.addEventListener('unhandledrejection', function(event) {
            const reason = event.reason;
            if (reason && (
                reason.name === 'TypeError' || 
                (reason.message && (
                    reason.message.includes('fullscreen') || 
                    reason.message.includes('Type error') || 
                    reason.message.includes('permission')
                ))
            )) {
                console.warn('Caught and bypassed fullscreen permission restriction inside iframe sandbox:', reason);
                event.preventDefault(); // 赤いエラー画面やクラッシュを防ぐ
            }
        });

        // 2. Element.prototype.requestFullscreen を安全にラップする
        try {
            const originalRequest = Element.prototype.requestFullscreen || 
                                    Element.prototype.webkitRequestFullscreen || 
                                    Element.prototype.mozRequestFullScreen || 
                                    Element.prototype.msRequestFullscreen;

            const safeRequestFullscreen = function() {
                if (originalRequest) {
                    try {
                        const promise = originalRequest.apply(this, arguments);
                        if (promise && typeof promise.catch === 'function') {
                            return promise.catch(err => {
                                console.warn("Fullscreen request rejected. Progressing experiment safely inside iframe:", err);
                                return Promise.resolve(); // 拒否されても、成功とみなして進める
                            });
                        }
                        return Promise.resolve();
                    } catch (err) {
                        console.warn("Caught synchronous error during fullscreen request:", err);
                        return Promise.resolve();
                    }
                }
                return Promise.resolve();
            };

            // 全ての要素に対して安全なFullscreenメソッドを適用
            Object.defineProperty(Element.prototype, 'requestFullscreen', {
                value: safeRequestFullscreen,
                configurable: true,
                writable: true
            });
            
            // documentのfullscreenEnabledプロパティを常にtrueとして騙し、jsPsychが常に動作するようにする
            Object.defineProperty(document, 'fullscreenEnabled', {
                value: true,
                configurable: true,
                writable: true
            });
        } catch (e) {
            console.warn("Failed to patch Fullscreen API (already secure or restricted environment):", e);
        }

        const jsPsych = initJsPsych({
            display_element: 'jspsych-target',
            on_finish: function() {
                // 実験終了時に安全に全画面を終了する（エラーを予防）
                try {
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
                        if (exitFS) {
                            const p = exitFS.call(document);
                            if (p && typeof p.catch === 'function') {
                                p.catch(() => {});
                            }
                        }
                    }
                } catch (e) {
                    console.warn("Failed to exit fullscreen gracefully:", e);
                }
                
                // データの抽出・整形およびGASへの自動送信を開始
                processAndSubmitData();
            }
        });

        // 刺激（「文字」と「色」の組み合わせ）の定義
        // 一致条件 (Congruent): 3種類, 不一致条件 (Incongruent): 6種類
        const stimuli = [
            // 一致条件 (Congruent)
            { word: "赤", color: "red", condition: "congruent", correct_key: "r" },
            { word: "青", color: "blue", condition: "congruent", correct_key: "b" },
            { word: "緑", color: "green", condition: "congruent", correct_key: "g" },
            
            // 不一致条件 (Incongruent)
            { word: "赤", color: "blue", condition: "incongruent", correct_key: "b" },
            { word: "赤", color: "green", condition: "incongruent", correct_key: "g" },
            { word: "青", color: "red", condition: "incongruent", correct_key: "r" },
            { word: "青", color: "green", condition: "incongruent", correct_key: "g" },
            { word: "緑", color: "red", condition: "incongruent", correct_key: "r" },
            { word: "緑", color: "blue", condition: "incongruent", correct_key: "b" }
        ];

        // 仕様書通り、合計10試行をランダム（重複あり）でサンプリング
        const test_stimuli = jsPsych.randomization.sampleWithReplacement(stimuli, 10);

        const timeline = [];

        // (0) 参加者ID入力画面
        const registration_trial = {
            type: jsPsychSurveyText,
            questions: [
                {
                    prompt: `
                        <div class="max-w-md mx-auto text-center mb-4">
                            <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-100">
                                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800">実験の事前登録</h2>
                            <p class="text-sm text-gray-500 mt-2">実験データの正確な管理のため、参加者ID（例：学籍番号）を入力してください。</p>
                        </div>
                        <span class="block text-sm font-semibold text-gray-700 mb-1 text-left">参加者ID</span>
                    `,
                    placeholder: "例: A1234567",
                    required: true,
                    name: 'subject_id'
                }
            ],
            button_label: "登録して準備画面へ",
            on_load: function() {
                const btn = document.querySelector('.jspsych-btn');
                if (btn) {
                    btn.className = "w-full px-6 py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-medium rounded-xl shadow-md transition-all duration-200 transform hover:scale-[1.01] active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer mt-4";
                }
            },
            on_finish: function(data) {
                // 入力されたIDの取得
                const response = data.response;
                const subject_id = (response && response.subject_id) ? response.subject_id.trim() : "anonymous";
                
                // 現在の日付・時刻（タイムスタンプ）をJST準拠でフォーマット
                const now = new Date();
                const timestamp = now.getFullYear() + '/' + 
                    ('0' + (now.getMonth() + 1)).slice(-2) + '/' + 
                    ('0' + now.getDate()).slice(-2) + ' ' + 
                    ('0' + now.getHours()).slice(-2) + ':' + 
                    ('0' + now.getMinutes()).slice(-2) + ':' + 
                    ('0' + now.getSeconds()).slice(-2);
                
                // 以降のすべての試行（response等）に自動的にIDと日時が組み込まれるようグローバル変数に登録
                jsPsych.data.addProperties({
                    subject_id: subject_id,
                    timestamp: timestamp
                });
            }
        };
        timeline.push(registration_trial);

        // (1) 全画面表示への切り替え試行
        const fullscreen_trial = {
            type: jsPsychFullscreen,
            fullscreen_mode: true,
            message: `
                <div class="max-w-md p-8 bg-white rounded-2xl shadow-xl border border-gray-100 text-center">
                    <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">実験前の準備</h2>
                    <p class="text-gray-500 mb-8 leading-relaxed text-sm">
                        より正確な測定を行うため、実験を全画面（フルスクリーン）モードで実行します。下記のボタンを押して開始してください。
                    </p>
                </div>
            `,
            button_label: "全画面表示にして開始する",
            // ボタンのUIを洗練
            on_load: function() {
                const btn = document.querySelector('.jspsych-btn');
                if (btn) {
                    btn.className = "px-6 py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-medium rounded-xl shadow-md transition-all duration-200 transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer";
                }
            }
        };
        timeline.push(fullscreen_trial);

        // (2) 教示画面の設定
        const instruction_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="max-w-xl p-8 bg-white rounded-2xl shadow-xl border border-gray-100 text-left">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center border-b pb-4">ストループ課題：ルール説明</h2>
                    <p class="text-lg text-gray-700 mb-6 leading-relaxed">
                        画面中央に「赤」「青」「緑」のいずれかの漢字が表示されます。<br>
                        漢字の持つ意味ではなく、<strong class="text-indigo-600">『文字の色』</strong>をできるだけ素早く、正確に回答してください。
                    </p>
                    
                    <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 mb-8">
                        <p class="font-bold text-gray-700 mb-3 text-center text-sm">【キーボード対応表】</p>
                        <div class="grid grid-cols-3 gap-3 text-center">
                            <div class="p-3 bg-white rounded-lg shadow-sm border border-gray-100">
                                <span class="block text-xs text-gray-400 mb-1">文字の色が</span>
                                <span class="text-lg font-bold text-red-600">赤色</span>
                                <span class="block mt-2 text-sm font-semibold bg-red-50 text-red-700 py-1 rounded border border-red-100">r キー</span>
                            </div>
                            <div class="p-3 bg-white rounded-lg shadow-sm border border-gray-100">
                                <span class="block text-xs text-gray-400 mb-1">文字の色が</span>
                                <span class="text-lg font-bold text-blue-600">青色</span>
                                <span class="block mt-2 text-sm font-semibold bg-blue-50 text-blue-700 py-1 rounded border border-blue-100">b キー</span>
                            </div>
                            <div class="p-3 bg-white rounded-lg shadow-sm border border-gray-100">
                                <span class="block text-xs text-gray-400 mb-1">文字の色が</span>
                                <span class="text-lg font-bold text-green-600">緑色</span>
                                <span class="block mt-2 text-sm font-semibold bg-green-50 text-green-700 py-1 rounded border border-green-100">g キー</span>
                            </div>
                        </div>
                    </div>
                    
                    <p class="text-center font-bold text-indigo-600 animate-pulse text-lg">
                        スペースキーを押すと、課題が始まります。
                    </p>
                </div>
            `,
            choices: [' '], // 反応キーはスペースキーのみ
            post_trial_gap: 500 // 教示終了後の空白マージン (500ms)
        };
        timeline.push(instruction_trial);

        // (3) メイン試行ループ (サンプリングした10試行を順番に処理)
        for (let i = 0; i < test_stimuli.length; i++) {
            const current_stim = test_stimuli[i];

            // a. 注視点 (+): 500ms 表示 (その後自動で消去)
            const fixation = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div class="fixation">+</div>',
                choices: "NO_KEYS", // キー反応は受け付けない
                trial_duration: 500 // 500ms提示
            };

            // b. 刺激提示: 正しい色を回答させる
            const stimulus_trial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `<div class="stimulus" style="color: ${current_stim.color};">${current_stim.word}</div>`,
                choices: ['r', 'b', 'g'], // 許容する反応キー
                data: {
                    task: 'stroop',
                    trial_index_custom: i + 1,
                    word: current_stim.word,
                    color: current_stim.color,
                    condition: current_stim.condition,
                    correct_response: current_stim.correct_key
                },
                // 試行終了時の処理（正誤判定の追加記録）
                on_finish: function(data) {
                    // 参加者が入力したキーと正答キーを照合して正誤を判定
                    const isCorrect = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
                    // 要求仕様：正答なら"true"、誤答なら"false"という文字列を確実に保存（空欄を防止）
                    data.correct = isCorrect ? "true" : "false";
                }
            };

            // c. 試行間隔 (ITI): 1000ms (画面は空白)
            const iti = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '', // 空白画面
                choices: "NO_KEYS",
                trial_duration: 1000 // 1000ms提示
            };

            // タイムラインへ追加
            timeline.push(fixation);
            timeline.push(stimulus_trial);
            timeline.push(iti);
        }

        /**
         * ストループ本試行のみを抽出し、CSV文字列を作成したのち、GASへ指数バックオフで自動送信します。
         */
        async function processAndSubmitData() {
            const displayElement = jsPsych.getDisplayElement();
            
            // 1. ストループ課題のみの試行データを抽出（教示、事前調査、注視点を安全に除外）
            const relevantData = jsPsych.data.get().filter({ task: 'stroop' });
            const trialsArray = relevantData.values();

            // 参加者ID（全試行一律にアタッチされているはずだが、配列の最初から取得、万が一なければ anonymous）
            const subjectId = trialsArray.length > 0 ? (trialsArray[0].subject_id || "anonymous") : "anonymous";

            // 2. CSVヘッダーおよび行データの作成
            // 列：参加者ID（subject_id）、実施日時（timestamp）、提示された文字（word）、提示された色（color）、条件（condition）、反応時間（rt）、正答/誤答（correct）
            const headers = ["subject_id", "timestamp", "word", "color", "condition", "rt", "correct"];
            let csvRows = [];
            csvRows.push(headers.join(","));

            trialsArray.forEach(function(trial) {
                const values = headers.map(header => {
                    let val = trial[header];
                    // 空欄対策・値がない場合は空文字を補填
                    if (val === undefined || val === null) {
                        val = "";
                    }
                    // 文字列データ内のエスケープ処理（カンマやダブルクォーテーションの処理）
                    let strVal = String(val);
                    if (strVal.includes(",") || strVal.includes('"') || strVal.includes("\n")) {
                        strVal = '"' + strVal.replace(/"/g, '""') + '"';
                    }
                    return strVal;
                });
                csvRows.push(values.join(","));
            });

            const csvString = csvRows.join("\n");

            // 3. GAS自動送信（指数バックオフによるエラーハンドリング実装）
            const gasUrl = "https://script.google.com/macros/s/AKfycbzah-lM2LNln2_-Cyd4PXToIX-d3VQ7BBzvaUqatUGYpxk-86ApI8q6QNWszJ8pf85zxQ/exec";
            const maxRetries = 5;
            let currentDelay = 1000; // 初回ウェイト：1000ms(1秒)
            let success = false;

            // 送信中のローディング画面に安全に書き換え
            displayElement.innerHTML = `
                <div class="max-w-md p-8 bg-white rounded-2xl shadow-xl border border-gray-100 text-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-6"></div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">データを送信中...</h3>
                    <p class="text-sm text-gray-500">実験データをデータベースに保存しています。<br>画面を閉じずにそのままお待ちください。</p>
                </div>
            `;

            for (let i = 0; i < maxRetries; i++) {
                try {
                    // Google Apps ScriptのWebアプリに安全にPOST（CORS制約緩和のため mode: 'no-cors' を適用）
                    await fetch(gasUrl, {
                        method: "POST",
                        mode: "no-cors", 
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            subject_id: subjectId,
                            csv_data: csvString
                        })
                    });

                    // no-cors の場合レスポンスのステータス等は受け取れませんが、接続失敗（例外）にならなければ送信成功と判定します
                    success = true;
                    break;
                } catch (error) {
                    console.warn(`送信エラー (試行 ${i + 1}/${maxRetries}):`, error);
                    
                    if (i < maxRetries - 1) {
                        displayElement.innerHTML = `
                            <div class="max-w-md p-8 bg-white rounded-2xl shadow-xl border border-gray-100 text-center">
                                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500 mx-auto mb-6"></div>
                                <h3 class="text-xl font-bold text-amber-600 mb-2">再試行中 (${i + 1}/${maxRetries - 1})</h3>
                                <p class="text-sm text-gray-500">一時的な通信エラーが発生しました。<br>${currentDelay / 1000}秒後に再試行します。しばらくお待ちください。</p>
                            </div>
                        `;
                        // 指数ウェイトの待機
                        await new Promise(resolve => setTimeout(resolve, currentDelay));
                        currentDelay *= 2; // 指数倍に変更（1秒 -> 2秒 -> 4秒 -> 8秒...）
                    }
                }
            }

            // 4. 結果表示＆救済ダウンロードボタンの提示
            if (success) {
                displayElement.innerHTML = `
                    <div class="max-w-md p-8 bg-white rounded-2xl shadow-xl border border-gray-100 text-center">
                        <div class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">実験完了！</h3>
                        <p class="text-sm text-gray-500 mb-6">データは無事に送信・記録されました。<br>ご協力ありがとうございました。</p>
                        <button id="btn-manual-download" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg transition-colors cursor-pointer">
                            バックアップとしてCSVをダウンロード
                        </button>
                    </div>
                `;
            } else {
                // 送信に完全に失敗した場合の救済措置（ローカルCSVの手動ダウンロード）
                displayElement.innerHTML = `
                    <div class="max-w-md p-8 bg-white rounded-2xl shadow-xl border border-gray-100 text-center">
                        <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">通信に失敗しました</h3>
                        <p class="text-sm text-gray-500 mb-6">
                            何度も再送信を行いましたが、通信環境等の影響でデータを自動保存できませんでした。以下のボタンからデータを手動で保存し、実験者に提出してください。
                        </p>
                        <button id="btn-manual-download" class="w-full px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-medium rounded-xl shadow-md transition-colors cursor-pointer mb-2">
                            CSVファイルをダウンロード
                        </button>
                    </div>
                `;
            }

            // 手動ダウンロード処理の実装（iframe環境でも動作する形式）
            document.getElementById("btn-manual-download").addEventListener("click", function() {
                const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `stroop_task_${subjectId}.csv`);
                link.style.visibility = "hidden";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        // 実験の実行
        jsPsych.run(timeline);
    </script>
</body>
</html>
