<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミュラー・リヤー錯視実験</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css">
    <style>
        body { background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .jspsych-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<script>
    const jsPsych = initJsPsych({
        on_finish: function(data) {
            const display = jsPsych.getDisplayElement();
            display.innerHTML = '<p>データを送信中です...</p>';

            const filteredData = jsPsych.data.get().filter({trial_type: 'canvas-keyboard-response'}).values().map(d => ({
                subject_id: jsPsych.data.get().values()[0].subject_id,
                timestamp: d.time_elapsed,
                angle: d.angle,
                wing_length: d.finLen,
                standard_len: 200,
                pse: d.variable_length,
                error_amount: d.variable_length - 200
            }));

            fetch('https://script.google.com/macros/s/AKfycbynST9hzG-08n7HKgACToKRR-De_5HUcVoKgozlcXBKWnFefSSY5MQQfR2rH44Ljf4K/exec', {
                method: 'POST',
                mode: 'no-cors',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(filteredData)
            }).then(() => {
                display.innerHTML = '<p>実験終了。ご協力ありがとうございました。</p>';
            });
        }
    });

    const trials = [];
    const angles = [15, 75];
    const finLengths = [20, 50];
    const baseLength = 200;

    // 1. 参加者ID入力
    trials.push({
        type: jsPsychSurveyText,
        questions: [{prompt: "参加者IDを入力してください", required: true, name: 'subject_id'}]
    });

    // 2. 実験パラメータ準備
    let combinations = [];
    angles.forEach(a => finLengths.forEach(f => {
        for(let i=0; i<3; i++) combinations.push({angle: a, finLen: f});
    }));
    combinations = jsPsych.randomization.shuffle(combinations);

    trials.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "<p>ミュラー・リヤー錯視実験</p><p>矢印キー（左右）で下の図形の長さを調整してください。</p><p>スペースキーで決定します。</p><p>何かキーを押すと開始します。</p>"
    });

    // 3. 試行生成
    combinations.forEach((cond, index) => {
        trials.push({
            type: jsPsychCanvasKeyboardResponse,
            prompt: `<p>試行 ${index + 1} / 12</p><p>左右キーで調整、スペースで決定</p>`,
            choices: [' '],
            canvas_size: [400, 600],
            data: { angle: cond.angle, finLen: cond.finLen, variable_length: Math.floor(Math.random() * 200) + 100 },
            variable_length: Math.floor(Math.random() * 200) + 100,

            stimulus: function(c) {
                const ctx = c.getContext('2d');
                const vLen = jsPsych.getCurrentTrial().variable_length;
                ctx.clearRect(0, 0, 600, 400);
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'black';
                drawMullerLyer(ctx, 300, 150, baseLength, cond.angle, cond.finLen, true);
                drawMullerLyer(ctx, 300, 250, vLen, cond.angle, cond.finLen, false);
            },

            on_load: function() {
                const trial = jsPsych.getCurrentTrial();
                window.addEventListener('keydown', function handleKey(e) {
                    if (e.key === 'ArrowLeft') trial.variable_length -= 2;
                    if (e.key === 'ArrowRight') trial.variable_length += 2;
                    const canvas = document.querySelector('canvas');
                    if(canvas) {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, 600, 400);
                        drawMullerLyer(ctx, 300, 150, baseLength, trial.data.angle, trial.data.finLen, true);
                        drawMullerLyer(ctx, 300, 250, trial.variable_length, trial.data.angle, trial.data.finLen, false);
                    }
                });
            },
            on_finish: function(data) {
                data.variable_length = jsPsych.getCurrentTrial().variable_length;
            }
        });
    });

    function drawMullerLyer(ctx, centerX, y, length, angleDeg, finLen, isInner) {
        const rad = (angleDeg * Math.PI) / 180;
        const x1 = centerX - length / 2;
        const x2 = centerX + length / 2;
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
        const dir = isInner ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x1 + finLen * Math.cos(rad), y - finLen * Math.sin(rad) * dir);
        ctx.moveTo(x1, y);
        ctx.lineTo(x1 + finLen * Math.cos(rad), y + finLen * Math.sin(rad) * dir);
        ctx.moveTo(x2, y);
        ctx.lineTo(x2 - finLen * Math.cos(rad), y - finLen * Math.sin(rad) * dir);
        ctx.moveTo(x2, y);
        ctx.lineTo(x2 - finLen * Math.cos(rad), y + finLen * Math.sin(rad) * dir);
        ctx.stroke();
    }

    jsPsych.run(trials);
</script>
</body>
</html>
